*{box-sizing:border-box}body{margin:0;background:#030811;color:#eaf7ff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;display:grid;place-items:center;height:100vh}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #3c617b;background:#102338;padding:12px 20px;font-weight:800;letter-spacing:1px}button:hover,button:focus-visible{background:#1d4260;outline:2px solid #64dfff;outline-offset:3px}.primary{background:#baff68;color:#102414;border-color:#baff68}.primary:hover{background:#dbffb1}#stage{width:min(100vw,1422px,177.7778vh);aspect-ratio:16/9;position:relative;isolation:isolate;box-shadow:0 0 100px #10355b}#game{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;background:linear-gradient(90deg,#06101af5,#07121bb5 50%,#06101a66);padding:5% 6%;overflow:auto}.eyebrow{font-size:12px;letter-spacing:4px;color:#88b4c9;margin-bottom:18px}.brand{font-size:clamp(26px,5.4vw,76px);font-weight:900;line-height:.95;letter-spacing:-3px;margin:0}.brand em{font-style:normal;color:#77d6ff}.subtitle{font-size:clamp(13px,1.6vw,23px);letter-spacing:6px;margin:16px 0 28px;color:#b8cfdd}.intro{max-width:340px;color:#a2bacc;line-height:1.7;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.vertical{display:grid;max-width:250px}.small{font-size:11px;color:#89a2b7;line-height:1.65}h2{margin:0;font-size:30px;letter-spacing:1px}h3{font-size:16px;letter-spacing:1px;margin:8px 0}#hud{display:none;position:absolute;inset:0;pointer-events:none;padding:2% 2.5%}.hudTop{display:flex;justify-content:space-between;gap:20px}.plate{background:#06111ee8;border:1px solid #35546a;padding:10px 14px;box-shadow:0 6px 20px #0005}.identity{font-size:13px;font-weight:800;letter-spacing:1.2px}.readout{font-size:10px;color:#a9c4d7;margin:6px 0}.bar{width:200px;height:7px;background:#223342;margin:5px 0;overflow:hidden}.bar i{display:block;height:100%;transition:width .1s;background:#7ceec8}#powerFill{background:#eced76}#status{font-size:11px;color:#7ee3ff;max-width:360px;min-height:14px}#hud button{pointer-events:auto;padding:7px 11px;font-size:11px}.hudBottom{position:absolute;bottom:3%;left:2.5%;right:2.5%;display:flex;align-items:end;justify-content:space-between;gap:12px}.skill{font-size:11px;border-left:2px solid #6ae0ff;padding:5px 10px;background:#071321e8;max-width:290px;line-height:1.6}.key{display:inline-grid;place-items:center;background:#213a4b;color:#edfbff;min-width:22px;height:22px;border:1px solid #4e6d82;margin-right:5px;font-weight:bold}.objective{text-align:right;font-size:11px;color:#b5cedb;max-width:310px;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 12px}.card{padding:12px;cursor:pointer;border:1px solid #284158;background:linear-gradient(160deg,#183249ab,#050b14e8);position:relative}.card.active{border-color:var(--tone);box-shadow:inset 0 0 28px #47bcff15,0 0 15px #52baff20}.card canvas{display:block;width:100%;height:130px;object-fit:contain}.card h3{font-size:13px;color:var(--tone)}.stats{font-size:10px;line-height:1.8}.stat{display:flex;justify-content:space-between}.card .powerName{font-size:9px;line-height:1.8;border-top:1px solid #284158;margin-top:8px;padding-top:8px}.number{position:absolute;top:8px;left:10px;color:#7796ae;font-size:11px}.help{display:grid;grid-template-columns:1fr 1fr;gap:12px 30px;margin-top:18px}.help p{font-size:12px;line-height:1.7;color:#b9cedc;margin:3px 0}.help strong{color:#edfbff}.footer{position:absolute;bottom:5%;font-size:10px;letter-spacing:2px;color:#7593a9}.tag{display:inline-block;padding:5px 8px;border:1px solid #355b71;color:#91defa;font-size:10px;letter-spacing:2px;margin-bottom:18px}.result{max-width:590px;margin:5% auto}.result p{line-height:1.7;color:#acc5d5}#toast{position:absolute;top:28%;left:50%;transform:translateX(-50%);color:#e2f9ff;background:#081925db;border:1px solid #3d677d;padding:10px 20px;font-size:13px;letter-spacing:1px;pointer-events:none;text-align:center;opacity:0;transition:opacity .12s;max-width:75%}#sound{margin-left:8px}.levelChoice{display:flex;gap:8px;margin:12px 0}.selected{border-color:#aef178;color:#c9ffb4}.helpPanel{background:#06121edb;padding:22px;border:1px solid #2f4c60}.muted{color:#849eb3}
@media(max-width:800px){#overlay{padding:3% 4%}.brand{font-size:40px}.intro{font-size:11px;max-width:260px}.subtitle{margin:12px 0}.eyebrow{font-size:9px;margin-bottom:12px}.actions{margin-top:12px}button{padding:8px 12px;font-size:11px}.card{padding:7px}.card canvas{height:85px}.cards{gap:7px;margin:10px 0}.stats{font-size:8px}.card h3{font-size:10px}.card .powerName{font-size:8px}.footer{display:none}h2{font-size:22px}.plate{padding:6px 9px}.identity{font-size:10px}.bar{width:145px}.readout,.skill,.objective,#status{font-size:8px}.help p{font-size:10px}.help{gap:5px 20px}.helpPanel{padding:12px}}

 <div class="hudTop"><div class="plate"><div class="identity" id="className"></div><div class="readout" id="healthText"></div><div class="bar"><i id="hpFill"></i></div><div class="readout" id="powerText"></div><div class="bar"><i id="powerFill"></i></div><div id="status"></div></div><div style="text-align:right"><div class="plate"><div class="identity" id="levelName"></div><div class="readout" id="armorText"></div><button id="pauseBtn">ESC / PAUSE</button><button id="sound">SOUND ON</button></div></div></div>

<script>
'use strict';
// GAME CONFIGURATION: valores del GDD y ajustes de equilibrio del prototipo.
const CONFIG={width:960,height:540,zoom:1.6,gravity:900,step:1/120,maxDelta:.05,speed:185,jump:345,hp:100,defense:{casual:10,heavy:30},heavySpeed:.78,friction:1450,acceleration:1600,enemyPatrol:50,enemyChase:100,enemyHP:78,enemyDefense:8,enemyAttack:37,enemyRange:340,enemyCooldown:1.65,projectileSpeed:220,attackDamage:38,attackCooldown:.38,attackDuration:.18,basicCooldown:7,advancedCooldown:10,parryDuration:.55,surgeDuration:.66,surgeInterval:.2,jumpBoostDuration:5,latencyRadius:145,restoreHeal:20,scanDuration:6,scanDefense:.6,latencyDuration:5,latencyScale:.42,shieldDuration:6,shieldHP:65,firewallDuration:3,malwareDuration:5,malwareDamage:6,malwareInterval:1,superDuration:10,superSpeed:400,powerPerHit:12,powerPerKill:18,powerPerBox:12,statSpeed:.035,statStrength:.025,statIntelligence:.025,statAdaptation:.025};
// Las conversiones estadísticas son decisiones del prototipo, no cifras del GDD.
const CHARACTERS={
 ai:{name:'AI WARRIOR',color:'#44adff',stats:[8,8,10,10],basic:'NEURAL SCAN',advanced:'PREDICTIVE STRIKE',role:'Read the threat. Strike first.',hint:'V: Parry an incoming hit, then teleport and counter.'},
 cloud:{name:'CLOUD WARRIOR',color:'#6df4ff',stats:[8,9,10,10],basic:'NETWORK LATENCY',advanced:'VIRTUALIZATION',role:'Control the network.',hint:'V: Save a restore point. Press V again to return and heal.'},
 devops:{name:'DEVOPS WARRIOR',color:'#ff9d41',stats:[8,7,9,9],basic:'AUTO-SHIELD',advanced:'PIPELINE SURGE',role:'Build. Test. Deploy.',hint:'V: Three hits, forward movement and a higher jump.'},
 cyber:{name:'CYBER WARRIOR',color:'#ff4866',stats:[8,8,10,10],basic:'FIREWALL BURST',advanced:'CRYPTO KEY STRIKE',role:'Protect the digital world.',hint:'V: Pierce defense and apply System Malware.'}
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
// Intersección segmento/AABB: también bloquea visión y ataques a través de muros.
function rayBox(x,y,ex,ey,r){let lo=0,hi=1;for(const [p,d,mn,mx] of [[x,ex-x,r.x,r.x+r.w],[y,ey-y,r.y,r.y+r.h]]){if(Math.abs(d)<.00001){if(p<mn||p>mx)return false;}else{let a=(mn-p)/d,b=(mx-p)/d;if(a>b)[a,b]=[b,a];lo=Math.max(lo,a);hi=Math.min(hi,b);if(lo>hi)return false;}}return true;}
class InputManager{
 constructor(){this.keys=new Set();this.pressed=new Set();const used=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyX','KeyV','KeyC','KeyF','Escape','Digit1','Digit2','Digit3','Digit4'];addEventListener('keydown',e=>{if(used.includes(e.code))e.preventDefault();if(!this.keys.has(e.code)&&!e.repeat)this.pressed.add(e.code);this.keys.add(e.code);});addEventListener('keyup',e=>this.keys.delete(e.code));addEventListener('blur',()=>{this.clear();if(window.game)game.pause();});}
 down(k){return this.keys.has(k);}take(k){const yes=this.pressed.has(k);this.pressed.delete(k);return yes;}clear(){this.keys.clear();this.pressed.clear();}
}
class AudioManager{
 constructor(){this.ctx=null;this.enabled=true;}
 unlock(){try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}catch(e){this.enabled=false;}}
 play(type){if(!this.enabled||!this.ctx)return;const tones={jump:[260,620,.13],kick:[150,45,.13],punch:[240,70,.09],hit:[110,40,.15],power:[410,980,.24],armor:[340,520,.13],super:[140,1100,.65],detect:[800,1200,.15]};const [a,b,d]=tones[type]||tones.hit;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=['hit','kick'].includes(type)?'sawtooth':'triangle';o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d);g.gain.setValueAtTime(.075,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d);}
}
// Partículas y textos comparten vida limitada; se eliminan al terminar y al reiniciar.
class Particle{
 constructor(x,y,color,text='',kind='spark'){Object.assign(this,{x,y,color,text,kind,vx:(Math.random()-.5)*130,vy:-30-Math.random()*95,life:text?1.1:.35+Math.random()*.35,max:1,size:2+Math.random()*2});this.max=this.life;if(text){this.vx=0;this.vy=-28;}if(kind==='ring'){this.vx=this.vy=0;this.life=this.max=.55;}}
 update(dt){this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;if(!this.text&&this.kind!=='ring')this.vy+=220*dt;}
 draw(c){c.save();c.globalAlpha=Math.max(0,this.life/this.max);c.fillStyle=c.strokeStyle=this.color;if(this.text){c.font='bold 9px Arial';c.textAlign='center';c.fillText(this.text,this.x,this.y);}else if(this.kind==='ring'){c.lineWidth=2;c.beginPath();c.ellipse(this.x,this.y,6+(1-this.life/this.max)*95,5+(1-this.life/this.max)*52,0,0,Math.PI*2);c.stroke();}else{c.fillRect(this.x,this.y,this.size,this.size);}c.restore();}
}
class Camera{constructor(){this.x=0;this.shake=0;}update(p,level,dt){this.x+= (clamp(p.x-220,0,level.width-CONFIG.width/CONFIG.zoom)-this.x)*Math.min(1,dt*7);this.shake=Math.max(0,this.shake-dt*18);}}
// Los dos niveles comparten motor: geometría, peligros, drones, señales y objetivos.
class Level{
 constructor(index){this.index=index;this.width=index?2700:2180;this.exit=this.width-100;this.blocks=[];this.hazards=[];this.enemies=[];this.pickups=[];this.tasks={walk:false,jump:false,crouch:false,attack:false,armor:false};this.boxesBroken=0;this.signs=[];
 const b=(x,y,w,h,type)=>this.blocks.push({x,y,w,h,type,hp:type==='box'?55:Infinity});b(0,286,this.width,60,'ground');b(-25,-300,25,640,'wall');b(this.width,-300,25,640,'wall');
 if(!index){b(285,250,36,36,'wall');b(385,228,115,15,'platform');b(610,-180,150,444,'pipe');b(880,244,38,42,'box');b(974,224,115,15,'platform');b(1510,246,38,40,'box');b(1690,251,35,35,'wall');this.enemies=[new Enemy(1160,0),new Enemy(1460,1),new Enemy(1900,2)];this.signs=[[150,'MOVE →','ARROW KEYS'],[288,'JUMP ↑','CLEAR THE WALL'],[605,'CROUCH ↓','HOLD DOWN'],[836,'KICK / PUNCH','SPACE'],[1130,'ARMOR CHECK','PRESS C'],[1780,'CLEAN THE CITY','DEFEAT DRONES']];this.pickups=[{x:442,y:206,used:false},{x:1024,y:202,used:false}];}
 else{b(230,241,38,45,'wall');b(330,224,110,16,'platform');b(530,-180,132,444,'pipe');b(770,245,40,41,'box');b(930,224,140,17,'platform');b(1100,243,38,43,'wall');b(1230,223,95,16,'platform');b(1410,-180,150,444,'pipe');b(1650,244,38,42,'box');b(1740,226,130,18,'platform');b(2060,245,40,41,'box');b(2160,241,38,45,'wall');b(2270,224,135,16,'platform');this.hazards=[{x:820,y:280,w:86,h:6},{x:1138,y:280,w:85,h:6},{x:1890,y:280,w:96,h:6}];this.enemies=[370,730,1050,1330,1730,2100,2440].map((x,i)=>new Enemy(x,i));this.signs=[[170,'DATA CENTER','STAY ALERT'],[510,'LOW PIPE','HOLD DOWN'],[805,'LIVE CURRENT','CASUAL: LONGER JUMP'],[1395,'SERVICE TUNNEL','CROUCH ↓'],[1870,'POWER LEAK','JUMP ↑'],[2450,'CORE ACCESS','DEFEAT DRONES']];this.pickups=[{x:986,y:202,used:false},{x:1810,y:204,used:false},{x:2320,y:202,used:false}];}}
 solids(){return this.blocks.filter(b=>b.hp>0);}
 blocked(x,y,ex,ey){return this.solids().some(r=>rayBox(x,y,ex,ey,r));}
 free(r){return !this.solids().some(b=>overlap(r,b));}
 // Colisiones AABB por ejes: primero X, después Y; el aterrizaje restablece grounded.
 move(a,dt){a.x+=a.vx*dt;for(const r of this.solids())if(overlap(a,r)){a.x=a.vx>0?r.x-a.w:r.x+r.w;a.vx=0;}a.grounded=false;a.y+=a.vy*dt;for(const r of this.solids())if(overlap(a,r)){if(a.vy>=0){a.y=r.y-a.h;a.grounded=true;}else a.y=r.y+r.h;a.vy=0;}}
 safePlace(p,x,feet){for(const shift of [0,-25,25,-50,50,-75,75]){const r={x:clamp(x+shift,1,this.width-p.w-1),y:feet-p.h,w:p.w,h:p.h};if(this.free(r)){p.x=r.x;p.y=r.y;p.vx=p.vy=0;return true;}}return false;}
 draw(c,g){for(const r of this.solids())if(r.x+r.w>g.camera.x-50&&r.x<g.camera.x+650)drawBlock(c,r,g.time);for(const h of this.hazards){c.fillStyle='#fc547f';c.shadowColor='#ff2859';c.shadowBlur=12;c.fillRect(h.x,h.y,h.w,h.h);c.shadowBlur=0;c.strokeStyle='#ffe7ed';c.beginPath();for(let i=0;i<=h.w;i+=6){const y=h.y-4-Math.sin(i+g.time*20)*4;i?c.lineTo(h.x+i,y):c.moveTo(h.x+i,y);}c.stroke();}for(const [x,title,sub] of this.signs){c.fillStyle='#081929dc';c.fillRect(x-18,123,112,36);c.strokeStyle='#34546d';c.strokeRect(x-18,123,112,36);c.fillStyle='#84dfff';c.font='bold 9px Arial';c.fillText(title,x-12,138);c.font='7px Arial';c.fillStyle='#b0cad8';c.fillText(sub,x-12,151);}for(const p of this.pickups)if(!p.used){c.save();c.translate(p.x,p.y+Math.sin(g.time*3)*4);c.rotate(Math.PI/4);c.fillStyle='#9cfad1';c.shadowBlur=12;c.shadowColor=c.fillStyle;c.fillRect(-6,-6,12,12);c.restore();}const x=this.exit;c.fillStyle='#0c2636';c.fillRect(x,196,52,90);c.strokeStyle='#9eecc7';c.lineWidth=2;c.strokeRect(x+6,203,40,83);c.fillStyle='#8ee8cb';c.font='8px Arial';c.fillText('EXIT →',x+8,190);for(let i=0;i<6;i++){c.globalAlpha=.2+Math.sin(g.time*3+i)*.12;c.fillRect(x+10,211+i*12,32,5);}c.globalAlpha=1;}
}
// El dron usa cinco estados. El cono frontal y el segmento visible son obligatorios.
class Enemy{
 constructor(x,id){Object.assign(this,{x,y:247,w:28,h:26,home:x,id,hp:CONFIG.enemyHP,face:-1,state:'PATROL',timer:0,cool:1,lost:0,scan:0,malware:0,tick:0,flash:0,kx:0});}
 see(g){const p=g.player,dx=p.x+p.w/2-(this.x+14),dy=p.y+p.h/2-(this.y+13),dist=Math.hypot(dx,dy);return dist<CONFIG.enemyRange&&dx*this.face>0&&Math.abs(dy)<Math.abs(dx)*1.7+16&&!g.level.blocked(this.x+14,this.y+13,p.x+p.w/2,p.y+p.h/2);}
 update(g,dt){if(this.hp<=0)return;const p=g.player;this.scan=Math.max(0,this.scan-dt);this.flash=Math.max(0,this.flash-dt);if(this.malware>0){this.malware-=dt;this.tick-=dt;if(this.tick<=0){this.tick+=CONFIG.malwareInterval;g.combat.hitEnemy(this,CONFIG.malwareDamage,true,false);if(this.hp<=0)return;}}const slow=p.latency>0&&Math.hypot(p.x-this.x,p.y-this.y)<CONFIG.latencyRadius?CONFIG.latencyScale:1;this.slow=slow<1;this.cool-=dt*slow;this.timer+=dt*slow;const visible=this.see(g);this.lost=visible?0:this.lost+dt;
 if(this.state==='PATROL'){if(Math.abs(this.x-this.home)>90)this.face=this.x>this.home?-1:1;if(visible){this.state='DETECT';this.timer=0;g.float(this.x+14,this.y-18,'ENEMY DETECTED','#ffcc73');g.audio.play('detect');}}
 else if(this.state==='DETECT'){if(!visible){this.state='PATROL';}else if(this.timer>.3){this.state='CHASE';this.timer=0;}}
 else if(this.state==='CHASE'){if(this.lost>1.2){this.state='RETURN';}else{this.face=p.x>this.x?1:-1;if(visible&&Math.abs(p.x-this.x)<155&&this.cool<=0){this.state='ATTACK';this.timer=0;}}}
 else if(this.state==='ATTACK'){if(this.timer>.45){if(visible){if(Math.abs(p.x-this.x)<44){g.combat.hurtPlayer(CONFIG.enemyAttack,this);}else{const dx=p.x+p.w/2-this.x-14,dy=p.y+p.h/2-this.y-13,n=Math.hypot(dx,dy)||1;g.projectiles.push(new Projectile(this.x+14,this.y+13,dx/n*CONFIG.projectileSpeed,dy/n*CONFIG.projectileSpeed,this));}}this.cool=CONFIG.enemyCooldown;this.state='CHASE';}}
 else if(this.state==='RETURN'){this.face=this.home>this.x?1:-1;if(visible){this.state='DETECT';this.timer=0;}else if(Math.abs(this.home-this.x)<5){this.state='PATROL';}}
 let vx=['PATROL','RETURN'].includes(this.state)?this.face*CONFIG.enemyPatrol:this.state==='CHASE'?this.face*CONFIG.enemyChase:0;if(this.state==='CHASE'&&visible&&Math.abs(p.x-this.x)<120)vx=0;const old=this.x;this.x+=(vx*slow+this.kx)*dt;this.kx*=Math.max(0,1-dt*8);for(const r of g.level.solids())if(overlap(this,r)){this.x=old;this.face*=-1;break;}this.x=clamp(this.x,20,g.level.width-40);}
 draw(c,t){if(this.hp<=0)return;const x=this.x+14,y=this.y+13+Math.sin(t*5+this.id)*2;c.save();c.translate(x,y);c.fillStyle='#0007';c.beginPath();c.ellipse(0,286-y,22,4,0,0,7);c.fill();const col=this.flash>0?'#fff':this.malware>0?'#ff4d96':this.scan>0?'#52c9ff':this.slow?'#6af4ff':'#ffae68';c.fillStyle='#1e3449';c.strokeStyle='#69849a';c.lineWidth=1.5;c.beginPath();c.moveTo(-21,-7);c.lineTo(-11,-12);c.lineTo(13,-10);c.lineTo(22,-2);c.lineTo(12,10);c.lineTo(-13,10);c.closePath();c.fill();c.stroke();c.fillStyle=col;c.shadowColor=col;c.shadowBlur=12;c.fillRect(this.face>0?7:-14,-4,7,5);c.fillRect(-16,11,5,3+Math.random()*3);c.fillRect(11,11,5,3+Math.random()*3);c.shadowBlur=0;c.strokeStyle=col;if(this.state==='ATTACK'){c.beginPath();c.arc(this.face*19,0,6+Math.sin(t*30)*2,0,7);c.stroke();}if(this.scan>0||this.malware>0){c.strokeRect(-25,-19,50,40);c.font='7px Arial';c.textAlign='center';c.fillText(this.malware>0?'SYSTEM MALWARE':'DEFENSE -40%',0,-26);}c.fillStyle='#122330';c.fillRect(-19,-21,38,3);c.fillStyle=col;c.fillRect(-19,-21,38*this.hp/CONFIG.enemyHP,3);c.fillStyle='#a8bac9';c.font='6px Arial';c.textAlign='center';c.fillText(this.state,0,29);c.restore();}
}
class Projectile{
 constructor(x,y,vx,vy,owner){Object.assign(this,{x,y,vx,vy,owner,w:5,h:5,life:3});}

 draw(c){c.strokeStyle='#ffbd88';c.lineWidth=3;c.shadowColor='#ff764f';c.shadowBlur=9;c.beginPath();c.moveTo(this.x-this.vx*.035,this.y-this.vy*.035);c.lineTo(this.x,this.y);c.stroke();c.shadowBlur=0;}

class CombatSystem{

 hurtPlayer(enemyAttack,source){const g=this.g,p=g.player;if(p.hp<=0||p.invuln>0)return;if(p.parry>0&&source&&source.hp>0){p.parry=0;p.invuln=.5;g.burst(p.x+11,p.y+16,p.color,25);g.level.safePlace(p,source.x-p.face*42,286);p.face=source.x>p.x?1:-1;p.state='PUNCH';p.attackTime=CONFIG.attackDuration;this.hitEnemy(source,85,true);g.float(p.x+11,p.y-20,'PREDICTED!',p.color);g.float(source.x+14,source.y-32,'CRITICAL HIT','#fff1a1');g.ring(p.x+11,p.y+20,p.color);g.camera.shake=7;return;}

 update(dt){for(const s of this.swings)s.life-=dt;this.swings=this.swings.filter(s=>s.life>0);}
 draw(c){for(const s of this.swings){c.save();c.globalAlpha=s.life/CONFIG.attackDuration*.7;c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=2;c.beginPath();c.ellipse(s.x+s.w/2,s.y+s.h/2,s.w/2,s.h/2,-.2,0,7);c.stroke();c.globalAlpha*=.17;c.fillRect(s.x,s.y,s.w,s.h);c.restore();}}
}

 if(axis){this.face=axis;this.vx+=clamp(axis*speed-this.vx,-CONFIG.acceleration*dt,CONFIG.acceleration*dt);}else{this.vx-=Math.sign(this.vx)*Math.min(Math.abs(this.vx),CONFIG.friction*dt);}

// Dibujo procedural: siluetas, equipo y paletas proceden de las cuatro infografías.
function visual_poly(c,pts,fill,stroke){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=.7;c.stroke();}}
function visual_line(c,pts,color,w=1){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.strokeStyle=color;c.lineWidth=w;c.stroke();}
function visual_dot(c,x,y,r,color){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=color;c.fill();}
function drawWarrior(c,p,x,y,scale=1,time=0){

  if(id==='devops'){c.strokeStyle='#a86735';c.lineWidth=2;c.beginPath();c.ellipse(-7,-25+bob,5,8,-.3,0,Math.PI*2);c.stroke();}

  if(heavy)visual_poly(c,[[-wide,-28+bob],[-4,-31+bob],[-2,-29+bob],[-wide+2,-25+bob],[-waist,-17+bob]],'#bcd2e633');
  if(id==='ai'){visual_poly(c,[[-7,-30+bob],[-6,-34+bob],[3,-33+bob],[7,-28+bob],[2,-27+bob]],shade,edge);visual_line(c,[[0,-27+bob],[0,-15+bob]],shade,1.1);visual_line(c,[[-4,-25+bob],[-5,-19+bob]],color,.8);}
  if(id==='cloud'){c.fillStyle=color;c.beginPath();c.arc(-1,-24+bob,2,Math.PI,0);c.arc(2,-24+bob,1.5,Math.PI,0);c.lineTo(3,-21+bob);c.lineTo(-4,-21+bob);c.closePath();c.fill();visual_line(c,[[-5,-18+bob],[5,-18+bob]],color,.6);}
  if(id==='devops'){visual_poly(c,[[-6,-27+bob],[0,-25+bob],[6,-27+bob],[4,-20+bob],[0,-18+bob],[-4,-20+bob]],shade,'#b97c4c');visual_line(c,[[-3,-23+bob],[0,-21+bob],[3,-23+bob]],color,1);}
  if(id==='cyber'){for(let j=0;j<3;j++)visual_poly(c,[[-6+j,-27+j*4+bob],[0,-25+j*4+bob],[6-j,-27+j*4+bob],[4-j,-23+j*4+bob],[0,-21+j*4+bob],[-4+j,-23+j*4+bob]],shade,color);}
  visual_line(c,[[-5,-15+bob],[5,-15+bob]],'#090e19',3);visual_dot(c,1,-15+bob,1.1,color);
  limb([hip,frontK,frontF]);if(heavy)visual_line(c,[[frontK[0]-1,frontK[1]+1],[frontF[0]-1,frontF[1]-2]],edge,.65);visual_dot(c,frontK[0],frontK[1],heavy?2.3:1.6,shade);visual_line(c,[frontF,[frontF[0]+3.2,frontF[1]]],shade,4.2);

class Game{
 constructor(){this.canvas=document.getElementById('game');this.ctx=this.canvas.getContext('2d');this.canvas.width=CONFIG.width;this.canvas.height=CONFIG.height;this.input=new InputManager();this.audio=new AudioManager();this.camera=new Camera();this.level=new Level(0);this.player=new Player('ai');this.combat=new CombatSystem(this);this.particles=[];this.projectiles=[];this.time=0;this.accumulator=0;this.last=0;this.death=0;this.toastTime=0;this.uiTick=0;this.state='main';this.ui=new UIManager(this);this.canvas.addEventListener('pointerdown',()=>this.audio.unlock());addEventListener('keydown',()=>this.audio.unlock(),{once:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)this.pause();this.last=0;this.accumulator=0;});addEventListener('resize',()=>this.resize());this.resize();requestAnimationFrame(t=>this.frame(t));}

 resume(){this.input.clear();this.accumulator=0;this.last=0;this.ui.show('play');}
 notify(text){document.getElementById('toast').textContent=text;this.toastTime=2;}
 float(x,y,text,color){this.particles.push(new Particle(x,y,color,text));}
 burst(x,y,color,n){for(let i=0;i<n;i++)this.particles.push(new Particle(x,y,color));if(this.particles.length>500)this.particles.splice(0,this.particles.length-500);}

 controls(){if(this.input.take('Escape')){if(this.state==='play')this.pause();else if(this.state==='pause')this.resume();else if(this.state==='help')this.ui.show(this.ui.returnState);}Object.keys(CHARACTERS).forEach((id,i)=>{if(this.input.take('Digit'+(i+1))){if(this.state==='play'&&this.player.hp>0)this.player.change(id,this);else if(this.state==='select'||this.state==='main')this.ui.choose(id);}});}
 // Bucle fijo de 120 Hz: se limita el delta a 50 ms y se descarta la espera al pausar.

 update(dt){this.player.update(this,dt);if(this.player.hp>0){for(const e of this.level.enemies)e.update(this,dt);for(const p of this.projectiles)p.update(this,dt);}this.projectiles=this.projectiles.filter(p=>p.life>0);this.combat.update(dt);for(const p of this.particles)p.update(dt);this.particles=this.particles.filter(p=>p.life>0);this.camera.update(this.player,this.level,dt);if(this.death>0){this.death-=dt;if(this.death<=0)this.ui.show('dead');return;}if(this.player.x>this.level.exit-4){const ready=this.level.enemies.every(e=>e.hp<=0)&&(this.level.index>0||(Object.values(this.level.tasks).every(Boolean)&&this.level.boxesBroken>0));if(ready)this.ui.show(this.level.index?'victory':'complete');else if(this.toastTime<=0)this.notify(this.level.enemies.some(e=>e.hp>0)?'CLEAR ALL DRONES TO OPEN THE EXIT':'COMPLETE TRAINING AND BREAK A BOX');}}
 draw(){const c=this.ctx;c.clearRect(0,0,CONFIG.width,CONFIG.height);drawBackdrop(c,this.level,this.camera,this.time,CONFIG.width,CONFIG.height);if(['main','select','help'].includes(this.state)&&this.ui.returnState!=='pause'){if(this.state==='main'){const ids=['cloud','devops','ai','cyber'];ids.forEach((id,i)=>drawWarrior(c,{id,heavy:true,state:'IDLE',face:1,superTime:0,flash:0},555+i*100,426+(i%2)*26,i===2?4.8:3.7,this.time));c.fillStyle='#91b4c7';c.font='10px Arial';c.fillText('AI  /  CLOUD  /  DEVOPS  /  CYBER',557,490);}return;}
 c.save();c.scale(CONFIG.zoom,CONFIG.zoom);c.translate(-this.camera.x+(Math.random()-.5)*this.camera.shake,(Math.random()-.5)*this.camera.shake);this.level.draw(c,this);for(const e of this.level.enemies)e.draw(c,this.time);for(const p of this.projectiles)p.draw(c);this.player.draw(c,this);this.combat.draw(c);for(const p of this.particles)p.draw(c);c.restore();
 // Primer plano, viñeta e iluminación se mantienen separados de la geometría física.
 const grad=c.createLinearGradient(0,480,0,540);grad.addColorStop(0,'#030a1000');grad.addColorStop(1,'#02060dde');c.fillStyle=grad;c.fillRect(0,480,960,60);if(this.player.flash>0){c.fillStyle='#ff284822';c.fillRect(0,0,960,540);}if(this.player.superTime>9.7){c.fillStyle='#fff49a33';c.fillRect(0,0,960,540);}}
}
// El archivo contiene todos los recursos; funciona también desde file:// sin servidor.
window.game=new Game();
